name: Build Patched StikDebug iOS

on:
  push:
    branches: [ "stikdebug-ios27-patched" ]
  workflow_dispatch:

jobs:
  build_stikdebug_ios:
    runs-on: macos-26
    steps:
      - name: Checkout patch host
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Fetch StikDebug source
        run: |
          git clone https://github.com/StikDebug/StikDebug.git StikDebug-src
          cd StikDebug-src
          git checkout 4bdfc92aa7cebd7a534f1e1ef56415f5727402de
          git submodule update --init --recursive

      - name: Apply iOS 27 reliability patch
        run: |
          cp stikdebug_ios27_patch.py StikDebug-src/
          cd StikDebug-src
          python3 stikdebug_ios27_patch.py
          git diff --check
          git diff -- StikDebug/App/AppBootstrapper.swift StikDebug/Views/HomeView.swift StikDebug/Device/JITEnableContext.swift

      - name: Build StikDebug
        run: |
          cd StikDebug-src
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4

      - name: Package IPA
        run: |
          cd StikDebug-src
          test -d build/StikDebug.xcarchive/Products/Applications/StikDebug.app
          rm -rf Payload
          mkdir -p Payload
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app Payload/
          zip -qry StikDebug-iOS27-Patched.ipa Payload
          test -s StikDebug-iOS27-Patched.ipa

      - name: Upload patched IPA
        uses: actions/upload-artifact@v7
        with:
          name: StikDebug_iOS27_Patched
          path: StikDebug-src/StikDebug-iOS27-Patched.ipa
          retention-days: 90
